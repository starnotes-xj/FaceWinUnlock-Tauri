name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动指定 tag（留空则使用当前 commit 生成）'
        required: false
        type: string
      prerelease:
        description: '标记为 pre-release'
        type: boolean
        default: false

env:
  OPENCV_VERSION: '4.12.0'
  # OpenVINO 运行时版本：为 Intel NPU 推理后端（backend=2 INFERENCE_ENGINE / target=9 NPU）提供支持。
  # 官方预编译 OpenCV 未启用 WITH_OPENVINO，故必须从源码编译 OpenCV 并链接此运行时。
  OPENVINO_VERSION: '2024.6'
  # 预构建 OpenCV 的 GitHub Release tag —— 运行 scripts/build_opencv_prebuilt.ps1 生成 zip
  # 并手动发布为 Release 后，在此更新 tag。留空则跳过下载（回退到旧版 builder 镜像）。
  OPENCV_PREBUILT_TAG: 'opencv-prebuilt-v1'
  CARGO_TERM_COLOR: always
  LLVM_ROOT: 'D:\LLVM'

jobs:
  build:
    name: Build & Release (${{ github.ref_name }})
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      # ---- OpenVINO runtime (Intel NPU 推理后端) ----
      # 官方预编译 OpenCV 未启用 OpenVINO，选 NPU 会报 StsNotImplemented -213
      # "Backend(plugin) is not available"。这里安装 OpenVINO 运行时供预构建的
      # OpenCV 链接，并在最终安装包中随附运行时 DLL（NPU 用户需要）。
      - name: Cache OpenVINO
        id: openvino-cache
        uses: actions/cache@v4
        with:
          path: D:\OpenVINO
          key: openvino-${{ env.OPENVINO_VERSION }}-v1

      - name: Download & Extract OpenVINO
        if: steps.openvino-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://storage.openvinotoolkit.org/repositories/openvino/packages/$env:OPENVINO_VERSION/windows/"
          Write-Host "Resolving OpenVINO archive from $base ..."
          # 目录页是 JS 动态渲染的空壳（HTML 里没有文件名），真实文件清单在 filetree.json。
          $tree = (Invoke-WebRequest -Uri "https://storage.openvinotoolkit.org/filetree.json" -UseBasicParsing).Content
          $pattern = "w_openvino_toolkit_windows_" + [regex]::Escape($env:OPENVINO_VERSION) + "[^`"]*_x86_64\.zip"
          # 同一版本在 filetree.json 里还含 dev/nightly 预览包（它们位于不同路径，/<ver>/windows/ 下
          # 并不存在），必须排除、只取正式发布包，确保与 $base 路径一致、URL 可下载。
          $zipName = [regex]::Matches($tree, $pattern) | ForEach-Object { $_.Value } |
            Where-Object { $_ -notmatch 'dev|nightly|rc|pre|beta' } | Sort-Object -Unique | Select-Object -First 1
          if (-not $zipName) { throw "Could not find OpenVINO release zip for $env:OPENVINO_VERSION in filetree.json" }
          $url = $base + $zipName
          $zip = "$env:RUNNER_TEMP\openvino.zip"
          Write-Host "Downloading $url ..."
          Invoke-WebRequest -Uri $url -OutFile $zip -RetryIntervalSec 10 -MaximumRetryCount 3
          Write-Host "Extracting OpenVINO..."
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\openvino_tmp" -Force
          $extracted = Get-ChildItem "$env:RUNNER_TEMP\openvino_tmp" -Directory | Select-Object -First 1
          Move-Item $extracted.FullName D:\OpenVINO
          Remove-Item "$env:RUNNER_TEMP\openvino_tmp" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "OpenVINO installed at D:\OpenVINO"
          Get-ChildItem D:\OpenVINO | Select-Object Name

      - name: Set OpenVINO environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ovCmake = "D:\OpenVINO\runtime\cmake"
          if (-not (Test-Path $ovCmake)) { throw "OpenVINO cmake config not found: $ovCmake" }
          $ovBin = "D:\OpenVINO\runtime\bin\intel64\Release"
          $tbbBin = "D:\OpenVINO\runtime\3rdparty\tbb\bin"
          "OpenVINO_DIR=$ovCmake" >> $env:GITHUB_ENV
          $ovBin >> $env:GITHUB_PATH
          if (Test-Path $tbbBin) { $tbbBin >> $env:GITHUB_PATH }
          Write-Host "OpenVINO_DIR=$ovCmake"

      # ---- OpenCV pre-built (下载预构建包，避免每次 CI 从源码编译 ~17 分钟) ----
      # 用 scripts/build_opencv_prebuilt.ps1 本地构建后，发布为 GitHub Release，
      # 在此更新 OPENCV_PREBUILT_TAG。预构建包内的 install/ 目录被解压到 D:\OpenCV\install。
      - name: Download pre-built OpenCV
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ env.OPENCV_PREBUILT_TAG }}"
          if (-not $tag) {
            throw "OPENCV_PREBUILT_TAG is empty — run scripts/build_opencv_prebuilt.ps1 locally first and set the tag"
          }
          # 获取 release 信息（不依赖 gh CLI，直接用 GitHub API）
          $repo = "${{ github.repository }}"
          $url = "https://api.github.com/repos/$repo/releases/tags/$tag"
          Write-Host "Fetching release info from: $url"
          $release = Invoke-RestMethod -Uri $url -Headers @{
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "Authorization" = "Bearer ${{ github.token }}"
          }
          $asset = $release.assets | Where-Object { $_.name -like "opencv-*-prebuilt.zip" } | Select-Object -First 1
          if (-not $asset) {
            throw "No opencv-*-prebuilt.zip asset found in release $tag — did you upload it?"
          }
          Write-Host "Downloading: $($asset.name) ($([math]::Round($asset.size / 1MB, 1)) MB)"
          $zip = "$env:RUNNER_TEMP\opencv-prebuilt.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip -Headers @{
            "Accept" = "application/octet-stream"
            "Authorization" = "Bearer ${{ github.token }}"
          }
          Write-Host "Extracting to D:\OpenCV\install ..."
          New-Item -ItemType Directory -Path "D:\OpenCV\install" -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath "D:\OpenCV\install" -Force
          Write-Host "Pre-built OpenCV extracted successfully"
          Get-ChildItem "D:\OpenCV\install" -Directory | Select-Object Name
          Get-ChildItem "D:\OpenCV\install" -Recurse -Filter "opencv_world*.lib" | Select-Object FullName

      # ---- LLVM (required by clang-sys / opencv crate build) ----
      # clang-sys / opencv-binding-generator need a discoverable libclang.
      - name: Install LLVM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Test-LlvmRoot {
            param([string]$Root)

            if (-not $Root -or -not (Test-Path $Root)) {
              return $false
            }

            return (Test-Path (Join-Path $Root "bin\libclang.dll")) -and `
              (Test-Path (Join-Path $Root "lib\libclang.lib"))
          }

          function Find-LlvmRoot {
            $candidateRoots = @(
              "$env:LLVM_ROOT",
              "${env:ProgramFiles}\LLVM",
              "${env:ProgramFiles(x86)}\LLVM",
              "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64",
              "${env:ProgramFiles}\Microsoft Visual Studio\2022\Professional\VC\Tools\Llvm\x64",
              "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64"
            ) | Where-Object { $_ -and (Test-Path $_) }

            foreach ($root in $candidateRoots) {
              if (Test-LlvmRoot $root) {
                return (Resolve-Path $root).Path
              }
            }

            $clang = Get-Command clang.exe -ErrorAction SilentlyContinue
            if ($clang) {
              $bin = Split-Path $clang.Source -Parent
              $root = Split-Path $bin -Parent
              if (Test-LlvmRoot $root) {
                return $root
              }
            }

            return $null
          }

          $sourceRoot = Find-LlvmRoot
          if (-not $sourceRoot) {
            Write-Host "Installing LLVM..."
            choco install llvm -y --no-progress --limit-output
            $sourceRoot = Find-LlvmRoot
          }

          if (-not $sourceRoot) {
            throw "LLVM with bin\libclang.dll and lib\libclang.lib was not found after installation."
          }

          $llvmRoot = $env:LLVM_ROOT
          $sourceRoot = (Resolve-Path $sourceRoot).Path
          $sameRoot = (Test-Path $llvmRoot) -and ((Resolve-Path $llvmRoot).Path -eq $sourceRoot)
          if ((Test-Path $llvmRoot) -and -not $sameRoot) {
            Remove-Item -LiteralPath $llvmRoot -Recurse -Force
          }
          if (-not (Test-Path $llvmRoot)) {
            New-Item -ItemType Directory -Path $llvmRoot | Out-Null
          }

          if (-not $sameRoot) {
            foreach ($dir in @("bin", "lib", "include")) {
              $src = Join-Path $sourceRoot $dir
              if (Test-Path $src) {
                $dst = Join-Path $llvmRoot $dir
                if (Test-Path $dst) {
                  Remove-Item -LiteralPath $dst -Recurse -Force
                }
                Copy-Item -LiteralPath $src -Destination $dst -Recurse -Force
              }
            }
          }

          $llvmBin = Join-Path $llvmRoot "bin"
          $libclang = Join-Path $llvmBin "libclang.dll"
          if (-not (Test-Path $libclang)) {
            throw "Normalized LLVM is missing libclang.dll: $libclang"
          }
          $libclangImportLib = Join-Path $llvmRoot "lib\libclang.lib"
          if (-not (Test-Path $libclangImportLib)) {
            throw "Normalized LLVM is missing libclang.lib: $libclangImportLib"
          }

          $llvmConfig = Join-Path $llvmBin "llvm-config.cmd"
          @"
          @echo off
          if "%~1"=="--prefix" (
            echo $llvmRoot
            exit /b 0
          )
          if "%~1"=="--includedir" (
            echo $llvmRoot\include
            exit /b 0
          )
          echo $llvmRoot
          "@ | Set-Content -Path $llvmConfig -Encoding ASCII

          Write-Host "LLVM source: $sourceRoot"
          Write-Host "LLVM root: $llvmRoot"
          Get-Item $libclang | Select-Object FullName, Length
          Get-Item $libclangImportLib | Select-Object FullName, Length

          "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          "LLVM_CONFIG_PATH=$llvmConfig" >> $env:GITHUB_ENV
          "LIBCLANG_STATIC=0" >> $env:GITHUB_ENV
          $llvmBin >> $env:GITHUB_PATH

      - name: Verify LLVM environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:LIBCLANG_PATH) {
            throw "LIBCLANG_PATH is not set"
          }
          $libclang = Join-Path $env:LIBCLANG_PATH "libclang.dll"
          if (-not (Test-Path $libclang)) {
            throw "LIBCLANG_PATH does not contain libclang.dll: $env:LIBCLANG_PATH"
          }
          $llvmRoot = Split-Path $env:LIBCLANG_PATH -Parent
          $libclangImportLib = Join-Path $llvmRoot "lib\libclang.lib"
          if (-not (Test-Path $libclangImportLib)) {
            throw "LLVM root does not contain libclang.lib: $libclangImportLib"
          }
          if (-not $env:LLVM_CONFIG_PATH -or -not (Test-Path $env:LLVM_CONFIG_PATH)) {
            throw "LLVM_CONFIG_PATH is not set to the generated llvm-config shim"
          }
          $prefix = & $env:LLVM_CONFIG_PATH --prefix
          if ($prefix.TrimEnd() -ne $env:LLVM_ROOT) {
            throw "llvm-config --prefix returned '$prefix', expected '$env:LLVM_ROOT'"
          }
          Write-Host "Using LIBCLANG_PATH=$env:LIBCLANG_PATH"
          Write-Host "Using LLVM_CONFIG_PATH=$env:LLVM_CONFIG_PATH"
          Get-Item $libclang | Select-Object FullName, Length
          Get-Item $libclangImportLib | Select-Object FullName, Length

      # ---- Rust builds ----
      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Server DLL + Unlock EXE + UIA Helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $libDir = (Get-ChildItem "D:\OpenCV\install" -Recurse -Filter "opencv_world*.lib" | Select-Object -First 1).Directory.FullName
          $binDir = (Get-ChildItem "D:\OpenCV\install" -Recurse -Filter "opencv_world*.dll" | Select-Object -First 1).Directory.FullName
          $incDir = "D:\OpenCV\install\include"
          $worldName = (Get-ChildItem "D:\OpenCV\install" -Recurse -Filter "opencv_world*.lib" | Select-Object -First 1).BaseName
          if (-not $libDir -or -not $binDir -or -not (Test-Path $incDir)) {
            throw "OpenCV install layout not found under D:\OpenCV\install"
          }
          # 覆盖 repo 内 .cargo/config.toml（旧路径指向 runner 预装的 D:\OpenCV\build\，不兼容
          # 我们下载到 D:\OpenCV\install 的预构建 OpenCV）。使用 Cargo [env] + force=true 语法，
          # 彻底覆盖 runner 系统级 OPENCV_* 变量。TOML 单引号字面量避免反斜杠转义。
          $configPath = Join-Path $env:GITHUB_WORKSPACE ".cargo\config.toml"
          if (Test-Path $configPath) { Remove-Item $configPath -Force }
          @"
          [env]
          OPENCV_INCLUDE_PATHS = { value = '${incDir}', force = true }
          OPENCV_LINK_PATHS    = { value = '${libDir}', force = true }
          OPENCV_LINK_LIBS     = { value = '${worldName}', force = true }
          "@ | Set-Content -Path $configPath -Encoding UTF8
          Write-Host "=== .cargo/config.toml [env] ==="
          Get-Content $configPath
          Write-Host "=== Verify pre-built OpenCV ==="
          Get-ChildItem "$libDir\opencv_world*.lib" | Select-Object FullName
          Get-ChildItem "$binDir\opencv_world*.dll" | Select-Object FullName
          # 确保 PATH 上有 DLL 目录，运行时需要
          $env:PATH = "$binDir;$env:PATH"
          # 清除缓存的构建脚本输出，强制 opencv crate 重新探测
          cargo clean -p clang-sys
          cargo clean -p opencv
          # uia-helper 产出 FaceWinUnlock-UIA-Helper.exe，tauri.conf.json 把它作为
          # resource 引用（../../target/release/FaceWinUnlock-UIA-Helper.exe），必须
          # 在 tauri build 之前构建好，否则 build.rs 的 resource 校验会 panic。
          cargo build --release -p winlogon -p unlock -p uia-helper
          # 不要删除 .cargo/config.toml —— 后续 "Build Tauri installer" 同样调用 cargo，
          # 需要这套 [env] 覆盖才能找到 D:\OpenCV\install。删除会导致 tauri build 时
          # opencv crate 退回 repo 自带的 D:\OpenCV\build 路径，runner 上不存在 → 失败。

      - name: Verify Server DLL & Unlock EXE & UIA Helper
        shell: pwsh
        run: |
          $dll = "target\release\FaceWinUnlock_Tauri.dll"
          $exe = "target\release\FaceWinUnlock-Server.exe"
          $uia = "target\release\FaceWinUnlock-UIA-Helper.exe"
          if (-not (Test-Path $dll)) { throw "Missing: $dll" }
          if (-not (Test-Path $exe)) { throw "Missing: $exe" }
          if (-not (Test-Path $uia)) { throw "Missing: $uia" }
          Write-Host "Server DLL: $((Get-Item $dll).Length) bytes"
          Write-Host "Unlock EXE: $((Get-Item $exe).Length) bytes"
          Write-Host "UIA Helper: $((Get-Item $uia).Length) bytes"

      # tauri.conf.json 硬编码 D:\OpenCV\build\x64\vc16\bin\opencv_world4120.dll
      # 作为 resource 路径（开发者本地编译产物布局）。CI 上 OpenCV 解压到
      # D:\OpenCV\install\，需镜像到硬编码路径，否则 tauri build.rs 资源校验 panic。
      #
      # 此外：opencv_world4120.dll 用 WITH_OPENVINO=ON 编译（见
      # scripts/build_opencv_prebuilt.ps1:122），加载时强制依赖 openvino.dll +
      # tbb12.dll 等运行时；安装包必须随附这些 DLL，否则启动即报 "找不到
      # openvino.dll"。把 OpenVINO 运行时 + TBB 也复制到 mirror 目录，并动态
      # 注入 tauri.conf.json resources，让 tauri build 一并打包到 NSIS/MSI。
      - name: Mirror OpenCV + OpenVINO DLLs and inject into Tauri resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dstBin = "D:\OpenCV\build\x64\vc16\bin"
          New-Item -ItemType Directory -Path $dstBin -Force | Out-Null

          # 1) OpenCV world DLL（+ 任何同目录的 opencv_* DLL）
          $cvSrcBin = (Get-ChildItem "D:\OpenCV\install" -Recurse -Filter "opencv_world*.dll" | Select-Object -First 1).Directory.FullName
          if (-not $cvSrcBin) { throw "Cannot locate opencv_world*.dll under D:\OpenCV\install" }
          Get-ChildItem $cvSrcBin -Filter "opencv_*.dll" | ForEach-Object { Copy-Item $_.FullName $dstBin -Force }

          # 2) OpenVINO 运行时 DLL + 插件清单 XML
          $ovBin = "D:\OpenVINO\runtime\bin\intel64\Release"
          $tbbBin = "D:\OpenVINO\runtime\3rdparty\tbb\bin"
          $injected = New-Object System.Collections.Generic.List[string]
          foreach ($srcDir in @($ovBin, $tbbBin)) {
            if (-not (Test-Path $srcDir)) { continue }
            Get-ChildItem $srcDir -File | Where-Object { $_.Extension -in @(".dll", ".xml") } | ForEach-Object {
              Copy-Item $_.FullName $dstBin -Force
              $injected.Add($_.Name)
            }
          }
          Write-Host "Mirrored $($injected.Count) OpenVINO/TBB files + OpenCV DLLs to ${dstBin}"

          # 3) 动态把 OpenVINO/TBB 文件注入 tauri.conf.json 的 resources
          #    （opencv_world4120.dll 已在 tauri.conf.json 中硬编码引用，不重复添加）
          $confPath = "UI\src-tauri\tauri.conf.json"
          $conf = Get-Content -Raw $confPath -Encoding UTF8 | ConvertFrom-Json -AsHashtable -Depth 50
          $existing = [System.Collections.Generic.HashSet[string]]::new()
          foreach ($k in $conf.bundle.resources.Keys) { $existing.Add($k) | Out-Null }
          foreach ($name in $injected) {
            $key = Join-Path $dstBin $name
            if (-not $existing.Contains($key)) {
              $conf.bundle.resources[$key] = $name
            }
          }
          $conf | ConvertTo-Json -Depth 50 | Set-Content $confPath -Encoding UTF8
          Write-Host "tauri.conf.json resources count: $($conf.bundle.resources.Count)"
          Get-ChildItem $dstBin | Measure-Object -Property Length -Sum | ForEach-Object {
            Write-Host "Total mirror size: $([math]::Round($_.Sum / 1MB, 1)) MB"
          }

      # ---- 生成 NPU 优化版 sface（Intel NPU 真正可用的关键步骤）----
      # OpenCV 把 sface 预处理里的「减标量」导成标量特例层，OpenVINO/NPU 无法
      # 编译（报 onnx_node!_minusscalar0 unsupported opset）。这里把标量常量改写
      # 成等价的 [1,3,1,1] 张量，让它走标准 nGraph Subtract，NPU 即可编译。
      # 脚本内含 onnxruntime 数值等价校验，校验不过会退回拷贝原模型，绝不产出坏模型。
      # 产物 face_recognition_sface_2021dec_npu.onnx 一定存在，供 tauri 打包。
      - name: Generate NPU-optimized sface model
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet onnx onnxruntime numpy
          $src = "UI/resources/face_recognition_sface_2021dec.onnx"
          $dst = "UI/resources/face_recognition_sface_2021dec_npu.onnx"
          python scripts/optimize_sface_for_npu.py $src $dst
          if (-not (Test-Path $dst)) { throw "NPU sface 产物缺失: $dst" }
          Write-Host "NPU sface 模型: $((Get-Item $dst).Length) bytes"

          # 动态注入 tauri.conf.json（不静态写入，避免本地 dev 缺该 CI 产物就构建失败）。
          $confPath = "UI\src-tauri\tauri.conf.json"
          $conf = Get-Content -Raw $confPath -Encoding UTF8 | ConvertFrom-Json -AsHashtable -Depth 50
          $key = "../resources/face_recognition_sface_2021dec_npu.onnx"
          $conf.bundle.resources[$key] = "resources/face_recognition_sface_2021dec_npu.onnx"
          $conf | ConvertTo-Json -Depth 50 | Set-Content $confPath -Encoding UTF8
          Write-Host "已注入 NPU sface 到 tauri resources，当前 resources 数: $($conf.bundle.resources.Count)"

      # ---- Tauri UI build ----
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: UI/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('UI/package-lock.json') }}

      - name: Install npm dependencies
        working-directory: UI
        run: npm ci

      - name: Build Tauri installer
        working-directory: UI
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ---- Package OpenVINO / OpenCV runtime (for Intel NPU support) ----
      # NPU 推理需要随附 OpenVINO 运行时 DLL + 预构建的 opencv_world DLL（含 OpenVINO 后端）。
      # 这些文件不在 Tauri 默认安装包内，单独打包成 zip 作为发布资产，
      # 用户解压后放入安装目录 resources\ 即可启用 NPU（仍需安装 Intel NPU 驱动）。
      - name: Package NPU runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "$env:RUNNER_TEMP\npu-runtime"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          # OpenCV world DLL（含 OpenVINO 后端）
          $worldDll = Get-ChildItem "D:\OpenCV\install" -Recurse -Filter "opencv_world*.dll" | Select-Object -First 1
          if ($worldDll) { Copy-Item $worldDll.FullName $stage }

          # OpenVINO 运行时 DLL + 插件清单
          $ovBin = "D:\OpenVINO\runtime\bin\intel64\Release"
          if (Test-Path $ovBin) {
            Get-ChildItem $ovBin -Filter "*.dll" | ForEach-Object { Copy-Item $_.FullName $stage }
            Get-ChildItem $ovBin -Filter "*.xml" | ForEach-Object { Copy-Item $_.FullName $stage }
          }
          # TBB（OpenVINO 依赖）
          $tbbBin = "D:\OpenVINO\runtime\3rdparty\tbb\bin"
          if (Test-Path $tbbBin) {
            Get-ChildItem $tbbBin -Filter "*.dll" | ForEach-Object { Copy-Item $_.FullName $stage }
          }

          $files = Get-ChildItem $stage
          Write-Host "Staged $($files.Count) runtime files:"
          $files | Select-Object Name
          if ($files.Count -eq 0) { throw "No runtime DLLs were staged" }

          $zip = "target\release\FaceWinUnlock-NPU-Runtime.zip"
          New-Item -ItemType Directory -Path "target\release" -Force | Out-Null
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          Write-Host "Created $zip"

      # ---- Release ----
      - name: Determine release metadata
        id: release_meta
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          # Strip leading 'v' for display version
          $version = $refName -replace '^v', ''
          $isPrerelease = "${{ github.event.inputs.prerelease }}" -eq "true"
          # Tag-driven releases are never prerelease unless the tag itself indicates it
          if ($refName -match '-(alpha|beta|rc|pre|dev)') {
            $isPrerelease = $true
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version, Prerelease: $isPrerelease"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.release_meta.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/release/FaceWinUnlock_Tauri.dll
            target/release/FaceWinUnlock-Server.exe
            target/release/FaceWinUnlock-NPU-Runtime.zip
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
