[package]
name = "winlogon"
version = "0.4.4"
edition = "2021"

[lib]
name = "FaceWinUnlock_Tauri"
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-core = "0.59"
log = "0.4"
simplelog = "0.12"
winreg = "0.52"

# 注意：workspace 构建下本 [profile.release] 会被 Cargo 忽略（profile 仅在根 Cargo.toml 生效），
# 故 `cargo build` 会提示 "profiles for the non root package will be ignored"。保留它用于记录本
# CP DLL 的理想 release 配置——尤其 panic="abort"：DLL 注入 LogonUI，panic 跨 COM/FFI 边界 unwind
# 属未定义行为，理应 abort。但 panic 是整个 build 统一、无法 per-package；而根 workspace 含 Tauri(UI)、
# 依赖 unwind 捕获 command panic，故不能在根设 panic="abort"。若要让本 DLL 真正以 panic=abort 构建，
# 需将 Server 拆为独立 workspace 单独编译（当前结构下此 profile 不生效，实际为默认 unwind）。
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
