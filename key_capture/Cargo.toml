[package]
name = "key_capture"
version = "0.1.0"
edition = "2021"

[lib]
name = "key_capture"
crate-type = ["cdylib"]

[[bin]]
name = "key_capture_injector"
path = "src/injector.rs"

[[bin]]
name = "key_verify"
path = "src/key_verify.rs"

[[bin]]
name = "key_scanner"
path = "src/key_scanner.rs"

[[bin]]
name = "mem_scanner"
path = "src/mem_scanner.rs"

[[bin]]
name = "ngc_decrypt"
path = "src/ngc_decrypt.rs"

[[bin]]
name = "ngc_crack"
path = "src/ngc_crack.rs"

[dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_Registry",
] }
windows-core = "0.59"
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
