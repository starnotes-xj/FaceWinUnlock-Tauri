<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <!-- Warm day palette from zerosoul/chinese-colors:
      象牙白 #fffbf0, 牙色 #eedeb0, 月白 #d6ecf0, 胭脂 #9d2933,
      靛蓝 #065279, 金色 #eacd76, 赤金 #f2be45, 石青 #7bcfa6
    -->
    <linearGradient id="dayBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbf0"/>
      <stop offset=".55" stop-color="#eedeb0"/>
      <stop offset="1" stop-color="#d6ecf0"/>
    </linearGradient>
    <linearGradient id="bluePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065279"/>
      <stop offset="1" stop-color="#2e4e7e"/>
    </linearGradient>
    <linearGradient id="redPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d2933"/>
      <stop offset="1" stop-color="#622a1d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2be45"/>
      <stop offset=".5" stop-color="#eacd76"/>
      <stop offset="1" stop-color="#f2be45"/>
    </linearGradient>
    <pattern id="silk" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M64 12 C84 32 104 42 116 64 C104 86 84 96 64 116 C44 96 24 86 12 64 C24 42 44 32 64 12Z" fill="none" stroke="#955539" stroke-width="1.2" opacity=".18"/>
      <path d="M64 36 C78 46 88 54 92 64 C88 74 78 82 64 92 C50 82 40 74 36 64 C40 54 50 46 64 36Z" fill="none" stroke="#065279" stroke-width="1" opacity=".14"/>
    </pattern>
    <pattern id="ruyiCloud" width="190" height="118" patternUnits="userSpaceOnUse">
      <path d="M16 74 C42 50 78 58 86 86 C112 48 168 56 176 96 L34 96 C12 96 0 86 16 74Z" fill="none" stroke="#955539" stroke-width="1.8" opacity=".28"/>
      <path d="M58 72 C72 50 112 50 126 76 M92 90 C114 70 146 76 158 94" fill="none" stroke="#065279" stroke-width="1.2" opacity=".18"/>
    </pattern>
    <pattern id="water" width="160" height="76" patternUnits="userSpaceOnUse">
      <path d="M0 58 C20 28 60 28 80 58 C100 28 140 28 160 58" fill="none" stroke="#065279" stroke-width="2" opacity=".22"/>
      <path d="M0 68 C20 44 60 44 80 68 C100 44 140 44 160 68" fill="none" stroke="#f2be45" stroke-width="1.3" opacity=".22"/>
    </pattern>
    <pattern id="lattice" width="92" height="92" patternUnits="userSpaceOnUse">
      <path d="M0 46 H92 M46 0 V92 M18 18 L74 74 M74 18 L18 74" stroke="#955539" stroke-width="1" opacity=".2"/>
      <circle cx="46" cy="46" r="14" fill="none" stroke="#065279" stroke-width="1" opacity=".14"/>
    </pattern>
    <pattern id="beads" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="3" fill="#9d2933" opacity=".16"/>
      <circle cx="48" cy="48" r="3" fill="#065279" opacity=".14"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#622a1d" flood-opacity=".18"/>
    </filter>
    <style>
      .font{font-family:"Microsoft YaHei UI","Noto Sans CJK SC","Segoe UI",sans-serif}
      .title{fill:#20383d;font-size:40px;font-weight:860;letter-spacing:2px}
      .sub{fill:#6f5b42;font-size:18px}
      .tiny{fill:#065279;font-size:12px;font-weight:850;letter-spacing:4px}
      .h2{fill:#20383d;font-size:25px;font-weight:820}
      .body{fill:#33484b;font-size:18px}
      .muted{fill:#7c6a54;font-size:14px}
      .label{fill:#20383d;font-size:16px;font-weight:850}
      .white{fill:#fffbf0}
      .num{fill:#20383d;font-size:46px;font-weight:900}
      .seal{fill:#fffbf0;font-size:17px;font-weight:850;writing-mode:tb;letter-spacing:4px}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="url(#dayBg)"/>
  <rect width="1800" height="1120" fill="url(#silk)" opacity=".9"/>
  <rect y="884" width="1800" height="236" fill="url(#water)" opacity=".82"/>
  <path d="M0 940 C180 900 292 966 462 930 C665 886 826 956 1028 912 C1240 868 1400 936 1800 852 L1800 1120 L0 1120Z" fill="#eedeb0" opacity=".68"/>

  <rect x="48" y="42" width="1704" height="1034" rx="44" fill="#fffbf0" opacity=".92" filter="url(#shadow)"/>
  <rect x="48" y="42" width="1704" height="1034" rx="44" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <rect x="76" y="70" width="1648" height="978" rx="34" fill="url(#beads)" opacity=".55"/>
  <g class="font">
    <rect x="84" y="78" width="292" height="966" rx="30" fill="url(#redPanel)"/>
    <rect x="84" y="78" width="292" height="966" rx="30" fill="url(#ruyiCloud)" opacity=".32"/>
    <text x="132" y="144" fill="#eacd76" font-size="12" letter-spacing="4" font-weight="850">FACE GUARD</text>
    <text x="132" y="188" class="white" font-size="28" font-weight="860">面容解锁</text>
    <rect x="126" y="252" width="208" height="58" rx="18" fill="#eedeb0"/>
    <text x="178" y="289" fill="#9d2933" font-size="18" font-weight="850">仪表盘</text>
    <text x="146" y="386" fill="#eedeb0" font-size="18">面容管理</text>
    <text x="146" y="462" fill="#eedeb0" font-size="18">通行密钥</text>
    <text x="146" y="538" fill="#eedeb0" font-size="18">安全场景</text>
    <text x="146" y="614" fill="#eedeb0" font-size="18">日志审计</text>
    <rect x="132" y="710" width="214" height="86" rx="22" fill="#065279" opacity=".78"/>
    <rect x="132" y="710" width="214" height="86" rx="22" fill="url(#water)" opacity=".45"/>
    <text x="158" y="748" class="white" font-size="16">守护状态</text>
    <text x="158" y="776" fill="#eacd76" font-size="18" font-weight="850">已就绪</text>
    <rect x="138" y="850" width="76" height="118" rx="9" fill="#065279" transform="rotate(-4 176 909)"/>
    <text x="164" y="872" class="seal">已守护</text>

    <rect x="420" y="86" width="1248" height="120" rx="30" fill="#eedeb0" stroke="#eacd76"/>
    <rect x="420" y="86" width="1248" height="120" rx="30" fill="url(#ruyiCloud)" opacity=".46"/>
    <text x="462" y="130" class="tiny">WARM DAY · RUYI CLOUD · NO SHARP TRIANGLES</text>
    <text x="462" y="180" class="title">面容与通行密钥安全中枢</text>
    <text x="1160" y="132" class="muted">象牙白 / 牙色 / 胭脂 / 靛蓝 / 金色</text>

    <rect x="420" y="246" width="580" height="360" rx="34" fill="#fff6e5" stroke="#eacd76"/>
    <rect x="420" y="246" width="580" height="360" rx="34" fill="url(#lattice)" opacity=".44"/>
    <text x="464" y="302" class="h2">身份识别核</text>
    <text x="464" y="336" class="muted">如意云与窗棂替代尖角山形。</text>
    <circle cx="710" cy="432" r="118" fill="#eedeb0" stroke="#f2be45" stroke-width="2.4"/>
    <circle cx="710" cy="432" r="86" fill="#fffbf0" stroke="#065279" stroke-width="2"/>
    <path d="M672 432 C680 384 740 384 748 432 C740 488 680 488 672 432Z" fill="#065279"/>
    <circle cx="710" cy="432" r="10" fill="#eedeb0"/>
    <path d="M568 432 H480 M852 432 H940 M710 288 V232 M710 576 V628" stroke="#9d2933" stroke-width="2" opacity=".42"/>

    <rect x="1040" y="246" width="300" height="168" rx="30" fill="#fffbf0" stroke="#eacd76"/>
    <rect x="1040" y="246" width="300" height="168" rx="30" fill="url(#beads)" opacity=".65"/>
    <text x="1078" y="300" class="h2">服务</text>
    <text x="1078" y="356" class="body">后台已就绪</text>
    <rect x="1218" y="320" width="82" height="36" rx="14" fill="#7bcfa6"/>
    <text x="1242" y="344" class="label">正常</text>

    <rect x="1370" y="246" width="298" height="168" rx="30" fill="#d6ecf0" stroke="#065279"/>
    <rect x="1370" y="246" width="298" height="168" rx="30" fill="url(#ruyiCloud)" opacity=".34"/>
    <text x="1408" y="300" class="h2">夜间</text>
    <text x="1408" y="356" class="body">统一暗色变量</text>

    <rect x="1040" y="442" width="628" height="164" rx="30" fill="#eedeb0" stroke="#eacd76"/>
    <rect x="1040" y="442" width="628" height="164" rx="30" fill="url(#ruyiCloud)" opacity=".32"/>
    <text x="1080" y="496" class="h2">通行密钥</text>
    <text x="1080" y="550" class="num">0.5.0.4</text>
    <rect x="1360" y="518" width="172" height="46" rx="16" fill="#065279"/>
    <text x="1394" y="547" class="white" font-size="16" font-weight="850">启用流程</text>

    <rect x="420" y="646" width="360" height="214" rx="32" fill="#fffbf0" stroke="#eacd76"/>
    <rect x="420" y="646" width="360" height="214" rx="32" fill="url(#ruyiCloud)" opacity=".28"/>
    <text x="464" y="702" class="h2">面容库</text>
    <text x="464" y="778" class="num">2</text>
    <text x="538" y="775" class="body">张已启用</text>

    <rect x="820" y="646" width="360" height="214" rx="32" fill="#d6ecf0" stroke="#065279"/>
    <rect x="820" y="646" width="360" height="214" rx="32" fill="url(#water)" opacity=".58"/>
    <text x="864" y="702" class="h2">人脸门</text>
    <text x="864" y="752" class="body">登录前验证</text>
    <rect x="864" y="794" width="130" height="40" rx="15" fill="#2edfa3"/>
    <text x="898" y="820" class="label">开启</text>

    <rect x="1220" y="646" width="448" height="214" rx="32" fill="#eedeb0" stroke="#955539"/>
    <rect x="1220" y="646" width="448" height="214" rx="32" fill="url(#beads)" opacity=".54"/>
    <text x="1264" y="702" class="h2">安全场景</text>
    <text x="1264" y="752" class="body">登录 · 解锁 · UAC · 浏览器</text>
    <rect x="1264" y="794" width="156" height="40" rx="15" fill="#9d2933"/>
    <text x="1302" y="820" class="white" font-size="16" font-weight="850">人脸优先</text>

    <rect x="420" y="900" width="1248" height="94" rx="30" fill="#065279" stroke="#f2be45"/>
    <rect x="420" y="900" width="1248" height="94" rx="30" fill="url(#ruyiCloud)" opacity=".28"/>
    <text x="464" y="956" class="white" font-size="18">改用圆润如意云纹和水纹，去掉奇怪尖角；日间保留暖象牙白与牙色。</text>
  </g>
</svg>
