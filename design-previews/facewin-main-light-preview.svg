<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F1E2"/>
      <stop offset=".55" stop-color="#EFE2C7"/>
      <stop offset="1" stop-color="#E8D6B0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173D42"/>
      <stop offset="1" stop-color="#0D262C"/>
    </linearGradient>
    <linearGradient id="cinnabar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C65A3A"/>
      <stop offset="1" stop-color="#8F2F27"/>
    </linearGradient>
    <pattern id="clouds" width="240" height="130" patternUnits="userSpaceOnUse">
      <path d="M20 72 C48 72 44 44 72 44 C92 44 100 58 110 70 C128 38 176 42 180 78 C206 76 222 90 222 106 L48 106 C20 106 2 92 20 72Z" fill="none" stroke="#B88933" stroke-width="2.4" opacity=".18"/>
      <path d="M58 30 C84 12 122 14 144 34 M92 58 C122 40 158 48 176 70" fill="none" stroke="#1E756A" stroke-width="1.5" opacity=".14"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#73592F" flood-opacity=".2"/>
    </filter>
    <style>
      .font { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; }
      .title { font-size: 34px; font-weight: 800; fill: #173139; }
      .subtitle { font-size: 18px; fill: #6A6E66; }
      .nav { font-size: 19px; fill: #4F5D5D; }
      .nav-on { font-size: 19px; font-weight: 700; fill: #FFF5E3; }
      .h2 { font-size: 26px; font-weight: 750; fill: #173139; }
      .body { font-size: 18px; fill: #31484A; }
      .muted { font-size: 15px; fill: #7B8178; }
      .pill { font-size: 15px; font-weight: 700; fill: #FFF5E3; }
      .num { font-size: 40px; font-weight: 800; fill: #173139; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#paper)"/>
  <rect width="1600" height="1000" fill="url(#clouds)"/>
  <circle cx="1380" cy="150" r="260" fill="#1E756A" opacity=".08"/>
  <circle cx="170" cy="845" r="300" fill="#C65A3A" opacity=".06"/>

  <rect x="58" y="48" width="1484" height="904" rx="34" fill="#FFF8E9" opacity=".92" filter="url(#shadow)"/>
  <rect x="58" y="48" width="1484" height="904" rx="34" fill="none" stroke="#B88933" stroke-opacity=".35"/>

  <rect x="58" y="48" width="292" height="904" rx="34" fill="#F4E7CC"/>
  <path d="M350 48 L350 952" stroke="#B88933" stroke-opacity=".24"/>
  <g class="font">
    <circle cx="128" cy="118" r="28" fill="url(#ink)"/>
    <path d="M118 120 C124 105 136 105 142 120 C138 134 122 134 118 120Z" fill="#E9D6AA"/>
    <text x="174" y="115" class="title" font-size="28">面容解锁</text>
    <text x="174" y="143" class="muted">FaceWinUnlock</text>

    <rect x="92" y="222" width="214" height="54" rx="18" fill="url(#cinnabar)"/>
    <text x="132" y="257" class="nav-on">仪表盘</text>
    <text x="104" y="343" class="nav">面容管理</text>
    <text x="104" y="413" class="nav">通行密钥</text>
    <text x="104" y="483" class="nav">首选项</text>
    <text x="104" y="553" class="nav">日志</text>

    <rect x="88" y="818" width="218" height="74" rx="22" fill="#EFE0C2" stroke="#C49B55"/>
    <text x="110" y="850" class="muted">系统服务</text>
    <text x="110" y="876" class="body">已就绪</text>
  </g>

  <g class="font">
    <text x="410" y="116" class="title">仪表盘</text>
    <text x="410" y="148" class="subtitle">宣纸暖底、墨青骨架、朱砂重点，祥云作为低对比装饰。</text>
    <rect x="1275" y="88" width="210" height="52" rx="18" fill="#F1E2C4" stroke="#C49B55"/>
    <circle cx="1311" cy="114" r="18" fill="#B84A34"/>
    <text x="1344" y="121" class="body">日间模式</text>

    <rect x="410" y="190" width="1010" height="170" rx="30" fill="#F7EBD2" stroke="#D6B36B"/>
    <text x="444" y="238" class="h2">今日状态</text>
    <text x="444" y="272" class="muted">面容、插件、后台服务一屏可见，少展示低频调试项。</text>
    <rect x="444" y="300" width="156" height="38" rx="14" fill="url(#ink)"/>
    <text x="472" y="325" class="pill">人脸优先</text>
    <rect x="620" y="300" width="156" height="38" rx="14" fill="url(#cinnabar)"/>
    <text x="648" y="325" class="pill">通行密钥</text>

    <rect x="410" y="400" width="320" height="245" rx="30" fill="#FFF5E3" stroke="#D6B36B"/>
    <text x="444" y="446" class="h2">面容库</text>
    <text x="444" y="480" class="muted">快速添加、验证、禁用</text>
    <text x="444" y="548" class="num">2</text>
    <text x="510" y="546" class="body">张面容</text>

    <rect x="760" y="400" width="320" height="245" rx="30" fill="#FFF5E3" stroke="#D6B36B"/>
    <text x="794" y="446" class="h2">通行密钥</text>
    <text x="794" y="480" class="muted">官方插件已启用</text>
    <text x="794" y="548" class="num">0.5.0.4</text>
    <rect x="794" y="580" width="168" height="38" rx="14" fill="url(#ink)"/>
    <text x="820" y="605" class="pill">打开管理器</text>

    <rect x="1110" y="400" width="310" height="245" rx="30" fill="#FFF5E3" stroke="#D6B36B"/>
    <text x="1144" y="446" class="h2">安全场景</text>
    <text x="1144" y="480" class="muted">登录、UAC、浏览器</text>
    <rect x="1144" y="522" width="142" height="38" rx="14" fill="#1E756A"/>
    <text x="1171" y="547" class="pill">已同步</text>

    <rect x="410" y="690" width="1010" height="120" rx="30" fill="#F7EBD2" stroke="#D6B36B"/>
    <text x="444" y="737" class="h2">设计原则</text>
    <text x="444" y="772" class="body">必要项突出，维护项折叠；日夜模式共用同一套语义色，避免白块残留。</text>
  </g>
</svg>
