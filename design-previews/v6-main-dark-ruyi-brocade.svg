<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <!-- v6 主软件 · 夜间 · 玄青/黛蓝/墨色 沉稳收敛
       中国色：玄青#3d3b4f 黛蓝#425066 墨色#50616d 月白#d6ecf0 靛蓝#065279 金#eacd76 胭脂#9d2933(少量)
       全部卡片/面板均为深色（演示无白底残留）；success 用金/月白，避免荧光绿与撞色 -->
  <defs>
    <linearGradient id="nightBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d3b4f"/>
      <stop offset=".45" stop-color="#3a4759"/>
      <stop offset="1" stop-color="#1c2530"/>
    </linearGradient>
    <radialGradient id="moonCorner" cx="84%" cy="9%" r="48%">
      <stop offset="0" stop-color="#d6ecf0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#d6ecf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3550"/><stop offset="1" stop-color="#2a2740"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eacd76"/><stop offset=".5" stop-color="#f2be45"/><stop offset="1" stop-color="#eacd76"/>
    </linearGradient>
    <linearGradient id="indigoBar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a4a6e"/><stop offset="1" stop-color="#13324a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#283a4b"/><stop offset="1" stop-color="#1b2836"/>
    </linearGradient>
    <pattern id="brocade" width="86" height="86" patternUnits="userSpaceOnUse">
      <path d="M43 5 L81 43 L43 81 L5 43Z" fill="none" stroke="#d6ecf0" stroke-width="1" opacity=".08"/>
      <circle cx="43" cy="43" r="3.2" fill="#eacd76" opacity=".12"/>
      <circle cx="5" cy="5" r="2" fill="#eacd76" opacity=".2"/><circle cx="81" cy="5" r="2" fill="#eacd76" opacity=".2"/>
      <circle cx="5" cy="81" r="2" fill="#eacd76" opacity=".2"/><circle cx="81" cy="81" r="2" fill="#eacd76" opacity=".2"/>
    </pattern>
    <pattern id="ruyi" width="190" height="118" patternUnits="userSpaceOnUse">
      <path d="M16 78 C42 54 78 62 86 90 C112 52 168 60 176 100 L34 100 C12 100 0 90 16 78Z" fill="none" stroke="#eacd76" stroke-width="1.8" opacity=".42"/>
      <path d="M58 76 C72 54 112 54 126 80" fill="none" stroke="#d6ecf0" stroke-width="1.1" opacity=".28"/>
    </pattern>
    <pattern id="water" width="168" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 60 C21 30 63 30 84 60 C105 30 147 30 168 60" fill="none" stroke="#d6ecf0" stroke-width="2" opacity=".26"/>
      <path d="M0 70 C21 46 63 46 84 70 C105 46 147 46 168 70" fill="none" stroke="#eacd76" stroke-width="1.4" opacity=".26"/>
    </pattern>
    <pattern id="lattice" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M0 45 H90 M45 0 V90 M0 0 L90 90 M90 0 L0 90" stroke="#eacd76" stroke-width="1" opacity=".15"/>
      <rect x="33" y="33" width="24" height="24" fill="none" stroke="#d6ecf0" stroke-width="1" opacity=".18" transform="rotate(45 45 45)"/>
    </pattern>
    <pattern id="beads" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="3" fill="#eacd76" opacity=".24"/><circle cx="42" cy="42" r="3" fill="#d6ecf0" opacity=".2"/>
      <circle cx="42" cy="14" r="2" fill="#d6ecf0" opacity=".22"/><circle cx="14" cy="42" r="2" fill="#eacd76" opacity=".26"/>
    </pattern>
    <pattern id="meander" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M3 17 V3 H37 M3 17 H29 V9 H15 V13" fill="none" stroke="#eacd76" stroke-width="1.6" opacity=".7"/>
    </pattern>
    <pattern id="icecrack" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 34 L40 52 L30 92 L72 112 M40 52 L82 30 L120 58 M82 30 L74 0 M30 92 L0 104 M72 112 L120 102 M82 30 L104 72 L72 112" fill="none" stroke="#d6ecf0" stroke-width="1" opacity=".24"/>
    </pattern>
    <g id="baoxiang">
      <g id="bxpetals"><path d="M0 -14 C12 -26 12 -50 0 -60 C-12 -50 -12 -26 0 -14Z" fill="none" stroke="#eacd76" stroke-width="1.6"/></g>
      <use href="#bxpetals" transform="rotate(45)"/><use href="#bxpetals" transform="rotate(90)"/>
      <use href="#bxpetals" transform="rotate(135)"/><use href="#bxpetals" transform="rotate(180)"/>
      <use href="#bxpetals" transform="rotate(225)"/><use href="#bxpetals" transform="rotate(270)"/>
      <use href="#bxpetals" transform="rotate(315)"/>
      <circle r="18" fill="none" stroke="#d6ecf0" stroke-width="1.6" opacity=".7"/>
      <circle r="8" fill="#eacd76" opacity=".4"/>
    </g>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .font{font-family:"Microsoft YaHei UI","Noto Sans CJK SC","Segoe UI",sans-serif}
      .title{fill:#e0eee8;font-size:40px;font-weight:860;letter-spacing:2px}
      .tiny{fill:#eacd76;font-size:12px;font-weight:850;letter-spacing:4px}
      .h2{fill:#e6f0ec;font-size:25px;font-weight:820}
      .body{fill:#cfe2e6;font-size:18px}
      .muted{fill:#9fb1b5;font-size:14px}
      .label{fill:#1c2530;font-size:16px;font-weight:850}
      .num{fill:#e6f0ec;font-size:46px;font-weight:900}
      .seal{fill:#f3d9a0;font-size:17px;font-weight:850;writing-mode:tb;letter-spacing:6px}
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#nightBg)"/>
  <rect width="1800" height="1120" fill="url(#brocade)"/>
  <rect width="1800" height="1120" fill="url(#moonCorner)"/>
  <rect y="892" width="1800" height="228" fill="url(#water)" opacity=".85"/>
  <path d="M0 946 C190 906 300 968 470 932 C672 888 832 956 1034 914 C1246 872 1404 938 1800 858 L1800 1120 L0 1120Z" fill="#16212c" opacity=".74"/>

  <rect x="48" y="42" width="1704" height="1034" rx="44" fill="#172430" opacity=".92" filter="url(#shadow)"/>
  <rect x="48" y="42" width="1704" height="1034" rx="44" fill="none" stroke="url(#gold)" stroke-width="1.5"/>

  <g class="font">
    <rect x="84" y="78" width="292" height="966" rx="30" fill="url(#redPanel)" stroke="#50616d"/>
    <rect x="84" y="78" width="292" height="966" rx="30" fill="url(#ruyi)" opacity=".42"/>
    <circle cx="148" cy="150" r="22" fill="#243449" stroke="#eacd76"/>
    <path d="M138 150 C142 134 154 134 158 150 C154 166 142 166 138 150Z" fill="#d6ecf0"/>
    <text x="184" y="142" fill="#eacd76" font-size="11" letter-spacing="3" font-weight="850">FACE GUARD</text>
    <text x="184" y="166" fill="#e0eee8" font-size="22" font-weight="860">面容解锁</text>
    <rect x="120" y="232" width="220" height="56" rx="18" fill="#eacd76"/>
    <text x="168" y="268" class="label" font-size="18">仪表盘</text>
    <text x="138" y="356" fill="#c2d2d5" font-size="18">面容管理</text>
    <text x="138" y="424" fill="#c2d2d5" font-size="18">通行密钥</text>
    <text x="138" y="492" fill="#c2d2d5" font-size="18">安全场景</text>
    <text x="138" y="560" fill="#c2d2d5" font-size="18">日志审计</text>
    <rect x="120" y="640" width="220" height="92" rx="22" fill="#0a4a6e"/>
    <rect x="120" y="640" width="220" height="92" rx="22" fill="url(#water)" opacity=".5"/>
    <text x="146" y="680" fill="#d6ecf0" font-size="15">守护状态</text>
    <text x="146" y="712" fill="#eacd76" font-size="20" font-weight="850">已就绪</text>
    <rect x="132" y="800" width="86" height="132" rx="10" fill="#9d2933" stroke="#eacd76" stroke-width="1.5" transform="rotate(-4 175 866)"/>
    <text x="162" y="826" class="seal" fill="#f3e2c4">面容守护</text>

    <rect x="420" y="86" width="1248" height="120" rx="28" fill="#223247" stroke="#eacd76"/>
    <rect x="430" y="92" width="1228" height="14" fill="url(#meander)" opacity=".7"/>
    <rect x="430" y="186" width="1228" height="14" fill="url(#meander)" opacity=".7"/>
    <text x="460" y="150" class="tiny">CALM NIGHT · 玄青黛蓝 · 沉稳收敛</text>
    <text x="460" y="184" class="title" font-size="34">面容与通行密钥安全中枢</text>
    <circle cx="1600" cy="146" r="30" fill="none" stroke="#eacd76" stroke-width="1.4" opacity=".6"/>
    <use href="#baoxiang" transform="translate(1600 146) scale(.5)"/>

    <rect x="420" y="246" width="580" height="360" rx="32" fill="url(#panel)" stroke="#d6ecf0" stroke-opacity=".3"/>
    <rect x="420" y="246" width="580" height="360" rx="32" fill="url(#lattice)" opacity=".55"/>
    <text x="462" y="300" class="h2">身份识别核</text>
    <text x="462" y="332" class="muted">同心扫描环 · 圆融如意 · 无尖角</text>
    <circle cx="712" cy="438" r="122" fill="none" stroke="#d6ecf0" stroke-width="1.2" opacity=".4"/>
    <circle cx="712" cy="438" r="122" fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-dasharray="10 10" opacity=".9"/>
    <circle cx="712" cy="438" r="92" fill="#1c2d3c" stroke="#d6ecf0" stroke-width="2"/>
    <circle cx="712" cy="438" r="92" fill="url(#beads)" opacity=".7"/>
    <path d="M672 438 C682 392 742 392 752 438 C742 492 682 492 672 438Z" fill="#d6ecf0" opacity=".88"/>
    <circle cx="712" cy="438" r="9" fill="#243449"/>
    <path d="M712 306 V336 M712 540 V570 M580 438 H610 M814 438 H844" stroke="#eacd76" stroke-width="2.4" opacity=".5"/>
    <path d="M712 316 A122 122 0 0 1 834 438" fill="none" stroke="#eacd76" stroke-width="4" stroke-linecap="round" opacity=".95"/>

    <rect x="1040" y="246" width="300" height="168" rx="28" fill="url(#panel)" stroke="#eacd76" stroke-opacity=".5"/>
    <rect x="1040" y="246" width="300" height="168" rx="28" fill="url(#beads)" opacity=".7"/>
    <text x="1076" y="300" class="h2">核心服务</text>
    <text x="1076" y="352" class="body">后台已就绪</text>
    <rect x="1212" y="322" width="92" height="40" rx="14" fill="#eacd76"/>
    <text x="1238" y="349" class="label">正常</text>

    <rect x="1370" y="246" width="298" height="168" rx="28" fill="#22303f" stroke="#50616d"/>
    <rect x="1370" y="246" width="298" height="168" rx="28" fill="url(#icecrack)" opacity=".7"/>
    <text x="1406" y="300" class="h2">夜间模式</text>
    <text x="1406" y="352" class="body">深色语义已统一</text>

    <rect x="1040" y="442" width="628" height="164" rx="28" fill="#223247" stroke="#eacd76" stroke-opacity=".55"/>
    <rect x="1040" y="442" width="628" height="164" rx="28" fill="url(#ruyi)" opacity=".34"/>
    <text x="1076" y="496" class="h2">通行密钥插件</text>
    <text x="1076" y="556" class="num">0.5.0.5</text>
    <rect x="1380" y="510" width="252" height="56" rx="18" fill="#eacd76"/>
    <text x="1418" y="546" class="label" font-size="17">打开注册 / 启用流程</text>

    <rect x="420" y="646" width="360" height="214" rx="30" fill="url(#panel)" stroke="#d6ecf0" stroke-opacity=".28"/>
    <use href="#baoxiang" transform="translate(690 760) scale(1.7)" opacity=".45"/>
    <text x="460" y="702" class="h2">面容库</text>
    <text x="460" y="800" class="num" font-size="64">2</text>
    <text x="520" y="800" class="body">张已启用</text>

    <rect x="820" y="646" width="360" height="214" rx="30" fill="#1c3344" stroke="#eacd76" stroke-opacity=".4"/>
    <rect x="820" y="646" width="360" height="214" rx="30" fill="url(#water)" opacity=".6"/>
    <text x="860" y="702" class="h2">人脸门</text>
    <text x="860" y="752" class="body">登录前人脸用户验证</text>
    <rect x="860" y="792" width="120" height="42" rx="15" fill="#d6ecf0"/>
    <text x="894" y="819" class="label">已开启</text>

    <rect x="1220" y="646" width="448" height="214" rx="30" fill="#223247" stroke="#9d2933" stroke-opacity=".7"/>
    <rect x="1220" y="646" width="448" height="214" rx="30" fill="url(#brocade)" opacity=".9"/>
    <text x="1260" y="702" class="h2">安全场景</text>
    <text x="1260" y="752" class="body">登录 · 解锁 · UAC · 浏览器</text>
    <rect x="1260" y="792" width="156" height="42" rx="15" fill="#9d2933"/>
    <text x="1298" y="819" fill="#f3e2c4" font-size="16" font-weight="850">人脸优先</text>

    <rect x="420" y="900" width="1248" height="94" rx="28" fill="url(#indigoBar)" stroke="#eacd76"/>
    <rect x="420" y="900" width="1248" height="94" rx="28" fill="url(#ruyi)" opacity=".28"/>
    <text x="460" y="942" fill="#e6f0ec" font-size="17" font-weight="800">v6 夜间 · 全深色面板（无白底）· 金与月白为主点缀 · 胭脂仅印章与场景标记</text>
    <text x="460" y="972" fill="#eacd76" font-size="15">玄青 · 黛蓝 · 墨色 · 月白 · 靛蓝 · 金（去荧光绿与撞色）</text>
  </g>
</svg>
