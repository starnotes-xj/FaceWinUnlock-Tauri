<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071B24"/>
      <stop offset="0.52" stop-color="#102C35"/>
      <stop offset="1" stop-color="#07131C"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42D7B6"/>
      <stop offset="1" stop-color="#158B7A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9C46A"/>
      <stop offset="1" stop-color="#B88933"/>
    </linearGradient>
    <pattern id="clouds" width="220" height="120" patternUnits="userSpaceOnUse">
      <path d="M16 64 C42 64 38 38 64 38 C82 38 90 52 98 62 C114 34 160 38 164 72 C188 70 204 82 204 98 L44 98 C18 98 0 84 16 64Z" fill="none" stroke="#D8B56D" stroke-width="2" opacity=".22"/>
      <path d="M56 28 C76 10 118 10 136 30 M92 52 C112 36 150 42 164 64" fill="none" stroke="#85E8D2" stroke-width="1.4" opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <style>
      .font { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #F4E8CF; }
      .subtitle { font-size: 18px; fill: #AFC8C6; }
      .nav { font-size: 19px; fill: #B7C9C9; }
      .nav-on { font-size: 19px; font-weight: 700; fill: #102822; }
      .h2 { font-size: 26px; font-weight: 700; fill: #F4E8CF; }
      .body { font-size: 18px; fill: #C8D6D3; }
      .muted { font-size: 15px; fill: #91AAA7; }
      .small { font-size: 14px; fill: #AFC8C6; }
      .pill { font-size: 15px; font-weight: 700; fill: #07211F; }
      .num { font-size: 40px; font-weight: 800; fill: #F4E8CF; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#clouds)" opacity=".9"/>
  <circle cx="1350" cy="150" r="250" fill="#1E756A" opacity=".12"/>
  <circle cx="1420" cy="880" r="340" fill="#C99B45" opacity=".09"/>

  <rect x="58" y="48" width="1484" height="904" rx="34" fill="#0B202A" opacity=".88" filter="url(#shadow)"/>
  <rect x="58" y="48" width="1484" height="904" rx="34" fill="none" stroke="#D8B56D" stroke-opacity=".35"/>

  <aside>
    <rect x="58" y="48" width="292" height="904" rx="34" fill="#091923" opacity=".95"/>
    <path d="M350 48 L350 952" stroke="#D8B56D" stroke-opacity=".22"/>
    <g class="font">
      <circle cx="128" cy="118" r="28" fill="url(#jade)"/>
      <path d="M118 120 C124 105 136 105 142 120 C138 134 122 134 118 120Z" fill="#062124"/>
      <text x="174" y="115" class="title" font-size="28">面容解锁</text>
      <text x="174" y="143" class="muted">FaceWinUnlock</text>

      <rect x="92" y="222" width="214" height="54" rx="18" fill="url(#gold)"/>
      <text x="132" y="257" class="nav-on">首选项</text>
      <text x="104" y="343" class="nav">仪表盘</text>
      <text x="104" y="413" class="nav">面容管理</text>
      <text x="104" y="483" class="nav">通行密钥</text>
      <text x="104" y="553" class="nav">日志</text>

      <rect x="88" y="818" width="218" height="74" rx="22" fill="#0F2A32" stroke="#2F756F"/>
      <text x="110" y="850" class="small">当前版本</text>
      <text x="110" y="876" class="body">v0.5.0</text>
    </g>
  </aside>

  <main>
    <g class="font">
      <text x="410" y="116" class="title">首选项</text>
      <text x="410" y="148" class="subtitle">夜间模式预览：所有卡片使用墨青底色，不再残留白色面板。</text>
      <rect x="1275" y="88" width="210" height="52" rx="18" fill="#0F2A32" stroke="#3E8E83"/>
      <circle cx="1311" cy="114" r="18" fill="url(#jade)"/>
      <text x="1344" y="121" class="body">夜间模式</text>

      <rect x="410" y="190" width="1010" height="92" rx="26" fill="#0F2A32" stroke="#2F756F"/>
      <text x="442" y="229" class="h2">系统集成</text>
      <text x="442" y="258" class="muted">登录磁贴、UAC、通行密钥与服务状态集中管理。</text>
      <rect x="1190" y="214" width="178" height="44" rx="16" fill="url(#jade)"/>
      <text x="1223" y="243" class="pill">同步至系统</text>

      <rect x="410" y="320" width="310" height="210" rx="28" fill="#102C35" stroke="#D8B56D" stroke-opacity=".38"/>
      <text x="444" y="362" class="h2">面容识别</text>
      <text x="444" y="397" class="muted">已启用</text>
      <text x="444" y="460" class="num">2</text>
      <text x="506" y="458" class="body">张可用面容</text>
      <rect x="444" y="480" width="136" height="36" rx="14" fill="#173E3C"/>
      <text x="468" y="504" class="small">新增面容</text>

      <rect x="750" y="320" width="310" height="210" rx="28" fill="#102C35" stroke="#D8B56D" stroke-opacity=".38"/>
      <text x="784" y="362" class="h2">通行密钥</text>
      <text x="784" y="397" class="muted">FaceWinUnlock Provider</text>
      <text x="784" y="460" class="num">0.5.0.4</text>
      <rect x="784" y="480" width="168" height="36" rx="14" fill="url(#jade)"/>
      <text x="810" y="504" class="pill">打开启用流程</text>

      <rect x="1090" y="320" width="330" height="210" rx="28" fill="#102C35" stroke="#D8B56D" stroke-opacity=".38"/>
      <text x="1124" y="362" class="h2">服务状态</text>
      <text x="1124" y="397" class="muted">后台服务与系统缓存</text>
      <rect x="1124" y="438" width="138" height="38" rx="14" fill="#E7C66B"/>
      <text x="1150" y="463" class="pill">运行正常</text>
      <text x="1124" y="508" class="small">无抢焦点弹窗</text>

      <rect x="410" y="570" width="1010" height="276" rx="30" fill="#0F2A32" stroke="#2F756F"/>
      <text x="444" y="615" class="h2">登录场景</text>
      <text x="444" y="648" class="muted">保留必要开关，减少调试型配置暴露。</text>
      <g>
        <rect x="444" y="690" width="260" height="72" rx="22" fill="#12343D"/>
        <circle cx="482" cy="726" r="16" fill="url(#jade)"/>
        <text x="516" y="721" class="body">登录 / 解锁</text>
        <text x="516" y="747" class="muted">人脸优先</text>
      </g>
      <g>
        <rect x="734" y="690" width="300" height="72" rx="22" fill="#12343D"/>
        <circle cx="772" cy="726" r="16" fill="url(#jade)"/>
        <text x="806" y="721" class="body">UAC / 浏览器确认</text>
        <text x="806" y="747" class="muted">通行密钥由插件处理</text>
      </g>
      <g>
        <rect x="1064" y="690" width="300" height="72" rx="22" fill="#12343D"/>
        <circle cx="1102" cy="726" r="16" fill="#E7C66B"/>
        <text x="1136" y="721" class="body">高级维护</text>
        <text x="1136" y="747" class="muted">折叠，不默认展示</text>
      </g>
    </g>
  </main>
</svg>
