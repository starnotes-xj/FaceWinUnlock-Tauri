<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04070C"/>
      <stop offset=".5" stop-color="#0B2029"/>
      <stop offset="1" stop-color="#050509"/>
    </linearGradient>
    <radialGradient id="jadeGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0" stop-color="#5CF2DC" stop-opacity=".34"/>
      <stop offset=".52" stop-color="#0C5E68" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C5FFF3"/>
      <stop offset=".55" stop-color="#45C9B7"/>
      <stop offset="1" stop-color="#106273"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFEAB0"/>
      <stop offset=".55" stop-color="#B98A38"/>
      <stop offset="1" stop-color="#FFF4C8"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EE6849"/>
      <stop offset="1" stop-color="#8B201E"/>
    </linearGradient>
    <pattern id="cloudCircuit" width="180" height="120" patternUnits="userSpaceOnUse">
      <path d="M12 68 C38 68 36 42 64 42 C84 42 94 56 102 68 C124 40 164 44 170 78 C194 76 210 88 210 102 L40 102" fill="none" stroke="#D8B56D" stroke-width="1.8" opacity=".22"/>
      <path d="M66 42 H92 V66 H130 V44 H170 M102 68 V98 M130 66 H150" fill="none" stroke="#55E6D1" stroke-width="1.4" opacity=".25"/>
    </pattern>
    <pattern id="brocade" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M48 8 C62 24 76 34 88 48 C76 62 62 72 48 88 C34 72 20 62 8 48 C20 34 34 24 48 8Z" fill="none" stroke="#D8B56D" stroke-width="1.2" opacity=".22"/>
      <circle cx="48" cy="48" r="12" fill="none" stroke="#55E6D1" stroke-width="1" opacity=".16"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <style>
      .font { font-family: "Microsoft YaHei UI", "Noto Sans CJK SC", "Segoe UI", sans-serif; }
      .title { fill:#FAEDD2; font-size:40px; font-weight:830; letter-spacing:2px; }
      .tiny { fill:#82FFF1; font-size:13px; letter-spacing:4px; font-weight:800; }
      .body { fill:#D8E8E5; font-size:19px; }
      .muted { fill:#8FA8A5; font-size:15px; }
      .h2 { fill:#FAEDD2; font-size:26px; font-weight:780; }
      .btn { fill:#061418; font-size:17px; font-weight:840; }
      .seal { fill:#FFF3E6; font-size:16px; font-weight:800; writing-mode:tb; letter-spacing:3px; }
    </style>
  </defs>
  <rect width="1800" height="1120" fill="url(#bg)"/>
  <rect width="1800" height="1120" fill="url(#jadeGlow)"/>
  <rect width="1800" height="1120" fill="url(#cloudCircuit)" opacity=".75"/>

  <rect x="100" y="76" width="1600" height="968" rx="46" fill="#07151D" opacity=".86" filter="url(#shadow)"/>
  <rect x="100" y="76" width="1600" height="968" rx="46" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity=".58"/>
  <rect x="132" y="108" width="1536" height="904" rx="34" fill="url(#brocade)" opacity=".24"/>

  <g class="font">
    <text x="170" y="156" class="tiny">FACEWINUNLOCK · PASSKEY PROVIDER</text>
    <text x="170" y="212" class="title">通行密钥管理器</text>
    <text x="170" y="248" class="body">去掉示例插件的实验感，只保留“启用、索引、人脸门、凭据”四件事。</text>

    <rect x="1375" y="150" width="170" height="54" rx="18" fill="#0D2A33" stroke="#55E6D1" stroke-opacity=".45"/>
    <text x="1410" y="184" class="body">中文 / EN</text>

    <rect x="170" y="316" width="660" height="250" rx="34" fill="#0D2730" stroke="#55E6D1" stroke-opacity=".38"/>
    <text x="214" y="370" class="h2">插件状态</text>
    <rect x="214" y="404" width="138" height="40" rx="15" fill="url(#jade)"/>
    <text x="252" y="430" class="btn">已启用</text>
    <text x="382" y="430" class="body">0.5.0.4 · FaceWinUnlock Provider</text>
    <rect x="214" y="486" width="210" height="52" rx="18" fill="url(#jade)"/>
    <text x="254" y="519" class="btn">打开启用页</text>
    <rect x="446" y="486" width="190" height="52" rx="18" fill="url(#gold)"/>
    <text x="484" y="519" class="btn">同步索引</text>
    <rect x="658" y="486" width="112" height="52" rx="18" fill="#153741" stroke="#55E6D1" stroke-opacity=".4"/>
    <text x="696" y="519" class="body">刷新</text>

    <rect x="880" y="316" width="620" height="250" rx="34" fill="#0D2730" stroke="#D8B56D" stroke-opacity=".42"/>
    <text x="924" y="370" class="h2">人脸门</text>
    <text x="924" y="408" class="body">使用 FaceWinUnlock 完成通行密钥操作前验证。</text>
    <rect x="924" y="466" width="176" height="44" rx="16" fill="url(#jade)"/>
    <text x="970" y="494" class="btn">已开启</text>
    <text x="1125" y="494" class="muted">隐藏“密码库锁定/确认/PRF”这类示例术语。</text>

    <rect x="170" y="620" width="1330" height="220" rx="34" fill="#0B2029" stroke="#D8B56D" stroke-opacity=".36"/>
    <text x="214" y="674" class="h2">凭据</text>
    <text x="214" y="708" class="muted">本地库是源数据；Windows 索引只用于发现和匹配，不显示“缓存”这种工程词。</text>
    <rect x="214" y="744" width="560" height="70" rx="22" fill="#11343E"/>
    <circle cx="250" cy="779" r="18" fill="url(#jade)"/>
    <text x="286" y="774" class="body">facewin-test</text>
    <text x="286" y="800" class="muted">webauthn.io · 已同步索引</text>
    <path d="M1160 744 C1210 744 1202 700 1250 700 C1288 700 1300 728 1312 748 C1345 710 1422 720 1430 778 C1468 774 1485 790 1492 814" fill="none" stroke="url(#gold)" stroke-width="3" opacity=".5"/>

    <rect x="170" y="888" width="900" height="78" rx="24" fill="#0D2730" stroke="#55E6D1" stroke-opacity=".28"/>
    <text x="214" y="936" class="body">高级维护：删除 Windows 索引、重建本地库、查看调试日志</text>
    <rect x="1110" y="894" width="92" height="92" rx="8" fill="url(#red)" transform="rotate(6 1156 940)"/>
    <text x="1144" y="910" class="seal">安全</text>
  </g>
</svg>
